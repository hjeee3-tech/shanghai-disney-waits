name: collect-wait-times

# 한 번 시작하면 최대 5시간 45분 동안 5분마다 수집한다.
# GitHub 예약 실행이 늦거나 빠져도 이전 작업이 계속 돌도록 4시간마다 새로 시작하고,
# 새 작업이 시작되면 이전 작업은 취소된다.
on:
  schedule:
    # 2시간마다 새로 켜서 이전 실행과 겹치게 한다(예약이 늦어도 빈 구간이 생기지 않도록)
    - cron: "0 23 * * *"
    - cron: "0 1,3,5,7,9,11,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - name: Collect every 5 minutes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            today=$(date -u +%Y%m%d); hm=$(date -u +%H%M)
            [ "$today" -gt 20261017 ] && break
            # 수집 시간: KST 08:00–22:30 = UTC 23:00–13:30
            if [ "$hm" -ge 2300 ] || [ "$hm" -le 1330 ]; then
              python3 collect.py; tail -n 1 collect.log
              git add -A data collect.log .last_updated
              if ! git diff --cached --quiet; then
                git commit -qm "data: $(date -u +%Y-%m-%dT%H:%MZ)"
                for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
              fi
            elif [ "$hm" -gt 1330 ] && [ "$hm" -lt 2230 ]; then
              echo "outside collection window"; break
            fi
            sleep $(( 300 - $(date +%s) % 300 ))
          done
